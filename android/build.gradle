allprojects {
    repositories {
        google()
        mavenCentral()
    }

    configurations.all {
        resolutionStrategy {
            force 'com.google.android.gms:play-services-maps:18.2.0'
        }
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'com.ncorti.ktfmt.gradle'

ktfmt {
    googleStyle()
}

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'com.google.maps.flutter.navigation'
    }

    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }

    defaultConfig {
        minSdkVersion 23
        consumerProguardFiles 'proguard.txt'
    }

    dependencies {
        implementation "androidx.car.app:app:1.4.0"
        implementation "androidx.car.app:app-projected:1.4.0"
        
        // Navigation library, but excluding maps to avoid conflict
        implementation("com.google.android.libraries.navigation:navigation:6.0.0") {
            exclude group: "com.google.android.gms", module: "play-services-maps"
        }

        // Explicitly add Google Maps
        implementation "com.google.android.gms:play-services-maps:18.2.0"

        testImplementation 'org.jetbrains.kotlin:kotlin-test'
        testImplementation 'io.mockk:mockk:1.13.8'
        testImplementation 'junit:junit:4.13.2'
        testImplementation 'org.robolectric:robolectric:4.9'
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
        unitTests.all {
            testLogging {
                events "passed", "skipped", "failed", "standardOut", "standardError"
                outputs.upToDateWhen {false}
                showStandardStreams = true
            }
        }
    }
}
